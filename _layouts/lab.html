---
layout: default
---

<div class="lab-content">
  <h1>{{ page.title }}</h1>

  {% if page.description %}
    <div class="lab-description">
      {{ page.description }}
    </div>
  {% endif %}

  <div class="lab-members">
    {{ content }}
  </div>
</div>

<style>
.member-section {
  margin: 2rem 0;
}

h2 {
  margin-top: 3rem;
  margin-bottom: 1rem;
}

/* Member grid */
.member-grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 24px 20px;
  margin: 1rem 0;
}

.member-card {
  min-width: 0;
  text-align: center;
}

/* Member photo */
.member-photo {
  display: block;
  width: 100%;
  max-width: 150px;
  aspect-ratio: 1 / 1;
  height: auto;
  object-fit: cover;
  border-radius: 5px;
  margin: 0 auto 10px;
}

/* Keep the three text lines visually consistent */
.member-name,
.member-position,
.member-origin {
  margin: 0;
  line-height: 1.25;
}

.member-name {
  font-weight: bold;
}

/* Give both line gaps the same spacing */
.member-name + .member-position,
.member-position + .member-origin {
  margin-top: 6px;
}

.member-position {
  color: #666;
  font-size: 0.9em;
}

.member-origin {
  color: #888;
  font-size: 0.8em;
  font-weight: normal;
}

/* Member card link */
.member-link,
.member-link:link,
.member-link:visited {
  display: block;
  color: inherit;
  text-decoration: none !important;
}

.member-link:hover,
.member-link:active {
  opacity: 0.8;
  text-decoration: underline !important;
}

/* Group photo */
.group-photo-container {
  width: 100%;
  margin: 2rem 0 3rem;
  text-align: center;
}

.group-photo {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
}

/* Alumni */
.alumni-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 16px;
}

.alumni-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
}

.alumni-name,
.alumni-edu,
.alumni-status {
  flex: 1;
}

.alumni-name {
  flex-basis: 25%;
  font-weight: 500;
  color: #111;
}

.alumni-edu {
  flex-basis: 30%;
  color: #111;
}

.alumni-status {
  flex-basis: 45%;
  color: #111;
}

/* Tablet */
@media (max-width: 900px) {
  .member-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

/* Mobile */
@media (max-width: 640px) {
  .member-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 22px 14px;
  }

  .member-photo {
    max-width: 140px;
  }

  .member-name {
    font-size: 1rem;
  }

  .member-position {
    font-size: 0.88rem;
  }

  .member-origin {
    font-size: 0.76rem;
  }

  .member-name + .member-position,
  .member-position + .member-origin {
    margin-top: 5px;
  }

  .alumni-row {
    align-items: flex-start;
    flex-direction: column;
    gap: 3px;
  }

  .alumni-name,
  .alumni-edu,
  .alumni-status {
    flex-basis: auto;
    width: 100%;
  }
}

/* Very small phones */
@media (max-width: 420px) {
  .member-grid {
    grid-template-columns: 1fr;
  }

  .member-photo {
    max-width: 180px;
  }
}
</style>
