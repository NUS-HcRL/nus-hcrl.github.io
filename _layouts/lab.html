---
layout: default
---

<div class="lab-content">
  <h1>{{ page.title }}</h1>
  
  {% if page.description %}
    <div class="lab-description">
      {{ page.description }}
    </div>
  {% endif %}

  <div class="lab-members">
    {{ content }}
  </div>
</div>

<style>
.member-section {
  margin: 2rem 0;
}

/* Add this new style for section headings */
h2 {
  margin-top: 3rem;  /* Increases space above section headings */
  margin-bottom: 1rem;
}

.member-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 20px;
  margin: 1rem 0;
}

.member-card {
  text-align: center;
}

.member-photo {
  width: 150px;
  height: 150px;
  object-fit: cover;
  border-radius: 5px;
  margin-bottom: 10px;
}

.member-name {
  font-weight: bold;
  margin: 5px 0;
}

.member-position {
  color: #666;
  font-size: 0.9em;
}

.member-link, 
.member-link:link,
.member-link:visited {
  text-decoration: none !important;
  color: inherit;
  display: block;
}

.member-link:hover,
.member-link:active {
  opacity: 0.8;
  text-decoration: underline !important;
}

.group-photo-container {
  width: 100%;
  margin: 2rem 0 3rem 0;  /* top right bottom left */
  text-align: center;
}

.group-photo {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
}

.alumni-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 16px;
}

.alumni-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
}

.alumni-name,
.alumni-edu,
.alumni-status {
  flex: 1;
}

.alumni-name {
  flex-basis: 25%;
  font-weight: 500;
  color: #111;
}

.alumni-edu {
  flex-basis: 30%;
  color: #111;
}

.alumni-status {
  flex-basis: 45%;
  color: #111;
}

</style>
