---
layout: default
---

<div class="publications-content">
  <h1>{{ page.title }}</h1>
  
  {% if page.description %}
    <div class="publications-description">
      {{ page.description }}
    </div>
  {% endif %}

  <div class="publications-list">
    {{ content }}
  </div>
</div>

<style>
  .publications-content {
    max-width: 900px; 
    margin: 0 auto; 
  }
  
  .publication-section {
    margin: 1.5rem 0; 
  }
  
  h2 {
    margin-top: 2rem;
    margin-bottom: 1rem;
  }
  
  .publications-list {
    display: flex;
    flex-direction: column;
    gap: 0px; 
    margin: 0.5rem 0;
  }
  
  .publication-card {
    display: grid;
    grid-template-columns: 140px 1fr;
    gap: 15px;
    padding: 1rem 0;
  }
  
  .publication-image-container {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  .publication-image {
    width: 100%;
    max-width: 140px;
    height: auto;
    border-radius: 5px;
  }
  
  .publication-info {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  
  .publication-title {
    font-weight: bold;
    font-size: 1em;
    color: #000;
    margin-bottom: 0px;
  }
  
  .publication-authors {
    color: #555;
    font-size: 0.95em;
    margin-bottom: 0;
  }
  
  .publication-venue {
    color: #000;
    font-size: 0.95em;
    margin-bottom: 0;
  }
  
  .publication-links {
    display: flex;
    gap: 20px;
    margin-top: 0px;
  }
  
  .publication-link {
    display: inline-block;
    text-decoration: none !important;
    color: #000;
    font-size: 0.95em;
    padding: 0px 0px;
    outline: none;
    text-align: left;
  }
  
  .publication-link:hover,
  .publication-link:visited,
  .publication-link:active,
  .publication-link:focus {
    text-decoration: none !important;
    outline: none;
  }
  
  .publication-link:hover {
    text-decoration: underline !important;
    background-color: transparent; 
  }
</style>
